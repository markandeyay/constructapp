[pytest]
# importlib import mode, for two reasons that both showed up when the Wave 2
# capability branches were merged.
#
# 1. Capability test suites independently chose the same file names, so
#    tests/aav/test_checks.py and tests/assembly/test_checks.py both resolved to
#    a module called test_checks and collection failed with an import file
#    mismatch. importlib mode derives a unique module name from the full path,
#    so same-named test files in sibling directories no longer collide.
#
# 2. The obvious alternative, adding __init__.py to each test directory, puts
#    tests/ on sys.path. tests/services/ would then shadow the real services
#    namespace package and services.api.routes would stop resolving. importlib
#    mode inserts nothing into sys.path, so that trap is avoided rather than
#    worked around.
addopts = --import-mode=importlib
testpaths = tests
